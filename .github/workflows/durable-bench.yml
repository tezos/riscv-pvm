name: Durable Storage Latency Benchmark

on:
  push:
    branches: [main]

  workflow_dispatch:

# Shared with the Benchmark workflow: both reserve the same reference machine, and a literal
# group name is what makes them serialise. ${{ github.workflow }} would give each workflow its
# own group, letting two benchmark runs share the machine and spoil each other's timings.
concurrency:
  group: reference-machine
  cancel-in-progress: false

jobs:
  benchmark:
    name: Durable Storage Latency Benchmark
    runs-on: ubuntu-latest

    # The reference machine does the work; this job only drives it. Prepopulating the databases
    # dominates the run.
    timeout-minutes: 180

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.BENCH_SSH_KEY }}

      - name: Configure SSH's known hosts
        run: echo "${{ secrets.BENCH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Checkout
        uses: actions/checkout@v7

      - name: Benchmark
        run: |
          scp scripts/ci-durable-bench.sh ${{ secrets.BENCH_HOST }}:durable-bench-${{ github.run_id }}.sh

          ssh ${{ secrets.BENCH_HOST }} ./durable-bench-${{ github.run_id }}.sh -r "${{ github.ref }}" >> $GITHUB_STEP_SUMMARY

          # Delete the benchmark script if the job succeeded, otherwise keep it for investigation
          ssh ${{ secrets.BENCH_HOST }} rm ./durable-bench-${{ github.run_id }}.sh
