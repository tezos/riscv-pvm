name: Continuous Integration

on:
  # Trigger this workflow on PRs
  pull_request:

  # Trigger this workflow for Merge Queue items
  merge_group:

  # Trigger this workflow on pushes to these branches
  push:
    branches: [main]

concurrency:
  # Cancel previous workflow runs for the same ref (e.g. same PR or branch)
  group: ${{ github.workflow }}-${{ github.ref }}

  # Cancel only if it is not the main branch
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  # Make Cargo output pretty
  CARGO_TERM_COLOR: "always"

  # Enable Sccache
  RUSTC_WRAPPER: "sccache"

  # Make sure Sccache automatically uses the GitHub Actions cache
  SCCACHE_GHA_ENABLED: "true"

  # Ensure the Nix formatter fails on changes
  TREEFMT_CI: "true"

jobs:
  run-make-target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            make-target: check check-nix build audit
            title: Linux Checks
          - runs-on: ubuntu-latest
            make-target: test
            title: Linux Tests
          - runs-on: ubuntu-latest
            make-target: bench
            title: Linux Component Benches
          - runs-on: ubuntu-latest
            make-target: codecov.json
            code-coverage: true
            title: Code Coverage
          - runs-on: macos-latest
            make-target: check
            title: MacOS Checks
          - runs-on: ubuntu-latest
            make-target: durable/long-test
            title: Durable Storage Long Tests

    name: ${{ matrix.title }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup
        with:
          save-nix-cache: ${{ github.ref_name == 'main' }}
          prefetch-cargo: ${{ github.ref_name == 'main' }}

      - name: Run 'make ${{ matrix.make-target }}'
        run: make ${{ matrix.make-target }}

      - name: Analyse code coverage
        if: matrix.code-coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

      - name: Save Rustup and Cargo cache
        if: github.ref_name == 'main'
        uses: actions/cache/save@v5.0.5
        with:
          key: ${{ steps.setup.outputs.rust-cache-primary-key }}
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db

      # Only when the primary-key cache was not found do we actually produce a cache. In that case
      # we need to clean up the Nix store a little to save space.
      - name: Clean up Nix store
        if: steps.setup.outputs.nix-cache-hit-primary-key != 'true' && github.ref_name == 'main'
        run: nix store gc
