name: Sanity

on:
  pull_request:
  merge_group:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    name: Conventional Commits
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: wagoid/commitlint-github-action@v6.2.1

  typos:
    runs-on: ubuntu-latest
    name: Typos
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1.37.1
