name: Nightly Tests

on:
  # Run every day at ~01:16 UTC
  # Avoids the start of the hour (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule)
  schedule:
    - cron: "16 1 * * *"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

env:
  # Make Cargo output pretty
  CARGO_TERM_COLOR: "always"

  # Enable Sccache
  RUSTC_WRAPPER: "sccache"

  # Make sure Sccache automatically uses the GitHub Actions cache
  SCCACHE_GHA_ENABLED: "true"

  # Time budget (minutes) shared by every nightly run
  MAX_MINUTES: "330"

jobs:
  # Build the long_test binary once and share it with every matrix job below.
  build:
    name: "Build nds long test binary"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Save the Nix cache so the test jobs restore this job's dev shell on a
      # cache miss, instead of each rebuilding the Nix store independently.
      - name: Set up build environment
        uses: ./.github/actions/setup
        with:
          save-nix-cache: true

      - name: Build long_test
        run: make durable/build-long-test

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: long_test
          path: target/release/long_test
          if-no-files-found: error
          retention-days: 1

  nds-long-test:
    name: "${{ matrix.test }} nds long test ops=${{ matrix.config.ops }} cases=${{ matrix.config.cases }} #${{ matrix.replica }}"
    needs: build
    runs-on: ubuntu-latest

    # Up to 6h
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        config:
          - { ops: 2000,  cases: 256 }
          - { ops: 4000,  cases: 128 }
          - { ops: 8000,  cases: 64 }
          - { ops: 16000, cases: 32 }
        test: [database, registry-stable]
        replica: [1, 2, 3, 4]
        include:
          - test: database
            args: database test
          - test: registry-stable
            args: registry test --keep-stable-size
        # Only run database tests on the first replica
        exclude:
          - test: database
            replica: 2
          - test: database
            replica: 3
          - test: database
            replica: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up build environment
        uses: ./.github/actions/setup
        with:
          build-deps: "false"

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: long_test

      - name: Run nds long test
        run: |
          chmod +x ./long_test # upload-artifact strips the executable bit
          ./long_test ${{ matrix.args }} \
            --ops-per-epoch ${{ matrix.config.ops }} \
            --cases-per-epoch ${{ matrix.config.cases }} \
            --keep-epochs 1 \
            --max-minutes ${{ env.MAX_MINUTES }} \
            --out-dir '${{ github.workspace }}/run-${{ matrix.test }}-${{ matrix.config.ops }}-${{ matrix.config.cases }}-${{ matrix.replica }}'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dursto-long-test-${{ matrix.test }}-${{ matrix.config.ops }}-${{ matrix.config.cases }}-r${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/run-${{ matrix.test }}-${{ matrix.config.ops }}-${{ matrix.config.cases }}-${{ matrix.replica }}/failure
          if-no-files-found: warn
          retention-days: 90
