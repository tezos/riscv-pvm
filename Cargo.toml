[workspace]
resolver = "3"
members = [
    "src/riscv/lib",
    "durable-storage",
    "tools/sandbox",
    "tools/analyse-jit-functions",
    "test-utils"
]
exclude = ["kernels"]

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[workspace.dependencies]
anyhow = "1.0"
arbitrary-int = "1.3.0"
bincode = "2.0"
blake3 = "1.8.2"
capstone = "0.13"
cfg-if = "1.0.3"
comfy-table = "7.2.1"
const_format = "0.2"
cranelift = "0.120.2"
cranelift-jit = "0.120.1"
cranelift-module = "0.120.1"
cranelift-native = "0.120.2"
ed25519-dalek = "2.2.0"
elf = "0.8.0"
enum-tag = "0.3.0"
gdbstub = "0.7.8"
gdbstub_arch = "0.3.2"
goldenfile = "1.8.0"
ieee-apsqrt = "0.1.1"
itertools = "0.14.0"
lazy_static = "1.5.0"
libsecp256k1 = "0.7.2"
meansd = "2.1.0"
memmap2 = "0.9.7"
num_enum = "0.7.4"
numfmt = "1.2.0"
object = "0.37"
ocaml-build = "1.0.0"
paste = "1.0.14"
perfect-derive = "0.1.5"
proptest = "1.8.0"
quanta = "0.12.6"
rand = "0.9.2"
range-collections = "0.4.6"
rustc-demangle = "0.1"
rustc_apfloat = "0.2.3"
serde_json = "1.0.143"
sha2 = "0.10.9"
sha3 = "0.10.8"
tempfile = "3.22.0"
thiserror = "2.0.17"
trait-set = "0.3.0"
try-blocks = "0.1.4"
tuples = "1.16.0"
vm-fdt = "0.3.0"
zerocopy = "0.8.27"
zerocopy-derive = "0.8.27"

[workspace.dependencies.tezos-smart-rollup-constants]
git = "https://gitlab.com/tezos/tezos.git"

[workspace.dependencies.tezos-smart-rollup-encoding]
git = "https://gitlab.com/tezos/tezos.git"

[workspace.dependencies.tezos-smart-rollup-utils]
git = "https://gitlab.com/tezos/tezos.git"

[workspace.dependencies.tezos-smart-rollup]
git = "https://gitlab.com/tezos/tezos.git"
features = ["utils"]

[workspace.dependencies.tezos_crypto_rs]
git = "https://gitlab.com/tezos/tezos.git"
default-features = false

[workspace.dependencies.strum]
version = "0.27.2"
features = ["derive"]

[workspace.dependencies.clap]
version = "4.5.50"
features = ["derive"]

[workspace.dependencies.derive_more]
version = "2.0.1"
features = ["debug", "display", "from", "into", "error"]

[workspace.dependencies.serde]
version = "1.0.228"
features = ["derive"]

[workspace.dependencies.hex]
version = "0.4.3"
features = ["serde"]

[workspace.dependencies.ocaml]
version = "1.1.0"
default-features = false

[workspace.dependencies.octez-riscv]
path = "src/riscv/lib"

[workspace.dependencies.octez-riscv-test-utils]
path = "test-utils"

# The dependency alias is used to make it obvious that it should not be used directly. Using it
# directly may have a surprising impact on performance when logging and tracing are disabled.
[workspace.dependencies.__tracing_do_not_use_directly]
package = "tracing"
version = "0.1.41"

[workspace.dependencies.tracing-subscriber]
version = "0.3.20"
features = ["json", "env-filter"]
