comment:
  # Ensure the project coverage is displayed in the PR comment.
  hide_project_coverage: false

coverage:
  status:
    project:
      default:
        # There is no fixed target, the default branch coverage sets the base line.
        target: auto
        # Project-wide coverage may drop by 1%
        threshold: 1%
    patch:
      default:
        # PRs must have newly added code covered sufficiently
        target: 80%

ignore:
  # Ignore test-only modules
  - "**/test.rs"
  - "**/tests.rs"
  # Argument parsing for the space accounting harness: no logic, and not reachable from the
  # test suite, so it can only ever report as uncovered. The harness itself is covered by
  # the restricted tests in `gc_space::scenario`.
  - "durable-storage/src/bin/gc_space.rs"
