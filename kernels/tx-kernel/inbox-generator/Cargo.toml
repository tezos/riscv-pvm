[package]
name = "tx-kernel-bench"
version = "0.0.0"
edition = "2021"

[dependencies]
bytes = "1.10.1"
clap = { version = "4.5.39", features = ["derive"] }
hex = { version = "0.4.3", features = ["serde"] }
libsecp256k1 = "0.7.2"
octez-riscv-data = { path = "../../../data" }
octez-riscv-durable-storage = { path = "../../../durable-storage", features = ["rocksdb"] }
regex = "1.12.1"
rlp = "0.5"
riscv-tx-kernel = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
