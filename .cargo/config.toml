[env]
CC_wasm32_unknown_unknown = "clang"
CC_riscv64gc_unknown_hermit = "clang"
CC_riscv64gc_unknown_linux_musl = "riscv64-unknown-linux-musl-cc"
OCTEZ_RISCV_ASSETS_DIR = { value = "assets", relative = true }
OCTEZ_RISCV_KERNELS_DIR = { value = "kernels", relative = true }
OCTEZ_RISCV_LIB_TESTS_DIR = { value = "src/riscv/lib/tests", relative = true }

[build]
rustdocflags = ["--deny", "warnings"]

[profile.profiling]
inherits = "release"
debug = true

[profile.test]
opt-level = 1
lto = false

# Required in order to build OCaml bindings with ocaml-rs on MacOS
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]

[target.riscv64gc-unknown-linux-musl]
linker = "riscv64-unknown-linux-musl-gcc"
rustflags = [
  "-C",
  "target-feature=+crt-static",
  "-C",
  "default-linker-libraries=y",
]
