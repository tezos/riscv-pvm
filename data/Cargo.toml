[package]
name = "octez-riscv-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
unstable-test-utils = ["dep:proptest", "dep:serde"]
# Parallelise the value-bytes BLAKE3 hash across a rayon pool for large values (see
# `blake3_bytes::hash_value`). OFF by default: it is a net win only above ~256 KiB (measured
# ~5-7x at 1-16 MiB) and a loss below ~128 KiB, and it pulls in a global thread pool. The output
# is byte-identical to the single-threaded hash, so enabling it never changes any state hash.
parallel-hashing = ["blake3/rayon"]

[dependencies]
bincode.workspace = true
blake3.workspace = true
hex.workspace = true
thiserror.workspace = true
perfect-derive.workspace = true
trait-set.workspace = true
memmap2.workspace = true
range-collections.workspace = true
bytes.workspace = true
unty.workspace = true

[dependencies.serde]
workspace = true
optional = true

[dependencies.derive_more]
workspace = true
features = ["from_str"]

[dependencies.proptest]
workspace = true
optional = true

[dev-dependencies]
tezos-smart-rollup-constants.workspace = true
proptest.workspace = true
rand.workspace = true
humansize.workspace = true
goldenfile.workspace = true
clap.workspace = true
blake3.workspace = true

[[bench]]
name = "proof"
harness = false
required-features = ["unstable-test-utils"]
